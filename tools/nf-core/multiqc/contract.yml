declares: contract
id: nf-core/multiqc@1.35
roles: [qc_aggregation]
nf_process: MULTIQC
nf_include: modules/nf-core/multiqc/main
# `grain: study, many: true` — MULTIQC takes every sample's report in ONE invocation. Without it the
# emitted workflow says `MULTIQC(ch_qc_report)` and runs once per sample, producing N reports
# where the entire point of the tool is to produce one.
consumes: [{name: reports, type_id: qc.report, grain: study, many: true}]
produces: [{name: report, type_id: qc.report::aggregated, format: [html]}]
params: []
priority: 0
# One tuple: `val(meta), path(multiqc_files)`, then four optional files (config, logo, replace
# names, sample names) passed empty. The engine gathers the reports as `[meta, files]` (#507).
nf_inputs: [{ports: [reports], pad: 4}]
