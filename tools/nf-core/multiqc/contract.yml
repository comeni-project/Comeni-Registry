declares: contract
id: nf-core/multiqc@1.35
roles: [qc_aggregation]
nf_process: MULTIQC
nf_include: modules/nf-core/multiqc/main
# `cardinality: "*"` — MULTIQC takes every sample's report in ONE invocation. Without it the
# emitted workflow says `MULTIQC(ch_qc_report)` and runs once per sample, producing N reports
# where the entire point of the tool is to produce one.
consumes: [{name: reports, type_id: qc.report, state_required: [], cardinality: "*"}]
produces: [{name: report, type_id: qc.report, state: [aggregated]}]
params: []
priority: 0
nf_inputs: [{ports: [reports]}]
container: community.wave.seqera.io/library/multiqc:1.35--c17fb751507e9dfc
provenance: {source: nf-core-meta-yml, drafted_by: hand, approved_by: rafael, approved_at: "2026-08-03"}
