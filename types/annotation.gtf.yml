declares: vocabulary
id: annotation.gtf
states: []
# One for the whole run, not one per sample — so it must emit as a VALUE channel. A
# process with several queue inputs runs as many times as the shortest, and a queue of
# one reference capped a 24-sample run at one invocation, silently.
scope: run
# **`{param}` is substituted at materialisation and is the ONLY substitution.** Not a
# template language — one placeholder, matched as the literal seven characters, the same
# argument as Plan 1.15's `transform`. `{` is legal Groovy and appears in these expressions
# already, so everything else is left alone.
#
# It replaced a literal `params.<name>`, which fused a PIPELINE decision into a TYPE: two
# channels of this type had one param and were therefore one hole, whatever the drawing said.
entry_channel: "Channel.fromPath(params.{param}, checkIfExists: true).map { gtf -> [ [id: gtf.baseName], gtf ] }"
test_data: "https://raw.githubusercontent.com/nf-core/test-datasets/72a702d346833d5523bc40d032323ea548603b00/reference/genes.gtf"
