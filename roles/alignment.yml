declares: role
# Place reads against a reference. One job that STAR and HISAT2 both do, which is
# exactly why a role is coarser than a contract: it lets one rule choose between them
# without naming either in its key. Audit A119 and A123 are what happens without it.
#
# A role is the job a contract does, and the only thing a tier-3 rule may target. Roles are
# closed (invariant 7): a contract naming one no layer declares fails to load with MD0302.
#
# One role per file is this layer's convention and `mendel registry lint` enforces it here.
# The format permits several — a private overlay may keep them however it likes, because
# invariant 11 says the layout is the author's business.
roles:
  - alignment
