# This layer's account of itself, and the argument to `mendel registry lint`.
#
# `kinds:` used to sit here listing the kinds this layer holds, and its own comment said it was
# "read by nobody" — a self-description with no consumer, which can only rot. It did: it named
# four kinds for the whole of Plan 1.15 Task 0, which shipped `roles/` beside it. `layout:`
# replaces it and has a consumer, so if it is wrong the lint refuses files that are correctly
# placed, which is loud.
#
# **The loader ignores all of this**, and that is invariant 11 holding: a file declares its own
# kind, so a layer may be one flat folder. What the curated registry does is hold itself to a
# layout its own CI enforces — nixpkgs's `pkgs/by-name` move — and a private overlay declares no
# `layout:` and is unenforced.
name: comeni-registry-examples
version: 0.1.0

# ── what this layer needs from Mendel ─────────────────────────────────────────────────────
#
# **2, because `entry_channel` carries a `{param}` placeholder.** A Mendel that does no
# substitution would write the seven literal characters `params.{param}` into Groovy and emit a
# pipeline that passes every check on its side and dies at launch with a syntax error, on a
# machine with no idea a registry was involved. `MD0020` refuses it and names the cause.
#
# Bump this only when an older Mendel would read the layer WRONGLY rather than not at all — a
# narrower test than "the format changed", and the whole value of the number. A new optional
# field an older reader ignores is not a bump.
#
# **The first bump gets a worse message than every later one**, and that is inherent rather than
# a defect: a Mendel predating the floor has no `requires_format` field, so `extra="forbid"`
# refuses this file with a Pydantic error instead of MD0020's sentence. There is exactly one
# such step and this is it.
requires_format: 2
licence: CC-BY-4.0
description: >-
  Hand-written registry data sufficient to build and test the RNA-seq spine. Not a
  curated registry: every contract here is a test fixture that happens to be true.

# Where each kind lives. A file whose `declares:` is not under one of its directories is
# misfiled, and `mendel registry lint` says so.
#
# Five things at the top: tools, profilers, inspectors, vocabulary and rules. **Declaring `tool`
# here is what turns on the one-folder-per-tool checks** (MD0021–MD0023); a layer that does not
# declare it lints as before.
layout:
  # Everything about one tool, together: what it is (tool.yml), its page, its own types, and one
  # folder per subtool. The path is the id (MD0021): `nf-core/samtools/sort` is in
  # tools/nf-core/samtools/sort/.
  tool: [tools/]
  # A profiler is a use of a tool to measure the data, run in the lab's pipeline; its contract
  # lives in profilers/<its id>/.
  contract: [tools/, profilers/]
  module: [tools/]
  # A type many tools touch is shared and lives in the vocabulary; a type only one tool's
  # modules touch lives in that tool's types/ (MD0023), namespaced by the tool's name (MD0017).
  vocabulary: [vocabulary/types/, tools/]
  # Facts about data, true regardless of which tool or inspector measures them.
  measurement: [vocabulary/measurements/]
  # The jobs a contract can do. One file each, named for the role.
  role: [vocabulary/roles/]
  # The first level of the type choice: what kinds of data exist. One file each.
  family: [vocabulary/families/]
  # Inspector pieces: code that measures an uploaded sample on the server, composed at run time
  # (a codec opens the bytes, a format reads records, a measure folds them into one fact). Each
  # is a declaration with its code, tests and fixtures beside it in piece/.
  codec: [inspectors/codecs/]
  format: [inspectors/formats/]
  measure: [inspectors/measures/]
  # Decisions *between* tools, belonging to neither. Filing a rule that chooses STAR over
  # HISAT2 under `star/` would be a lie about what it decides.
  rule: [rules/]
