declares: role
# Join a sample's pieces into one (comeni-labs#466): the lanes of a sample sequenced over several,
# before anything reads the sample, or the parts a split step made, after it. A merger consumes
# every piece of one sample and produces the same type at sample grain; the build places it only
# around the steps that need it, never as a routed producer.
roles:
  - id: merging
    label: Merge files
    explain: >-
      Joins the pieces of one sample, such as the lanes it was sequenced over or the parts a step
      ran on, into one before anything else reads it.
