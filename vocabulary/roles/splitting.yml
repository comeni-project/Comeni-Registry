declares: role
# Split a sample's item into parts that run in parallel (comeni-labs#466, stage 6). A splitter
# reads one type and fans out (`fans_out: part`) to parts of the same type; the build places it
# before a step that can run on parts, and a merger after it, unless the person keeps the step
# whole.
roles:
  - id: splitting
    label: Split into parts
    explain: >-
      Splits one sample's data into parts that later steps run on in parallel, merged back per
      sample afterwards.
