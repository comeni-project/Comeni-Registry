declares: role
# Measure the data so a rule has a premise to read (comeni-labs#465). A measurer in
# measurers/ that runs in the pipeline becomes a step filling this role: when a setting is
# decided at run time from a fact nobody knew before the build, or to confirm on all the data
# an estimate the build used.
#
# A role is the job a contract does, and the only thing a tier-3 rule may target. Roles are
# closed (invariant 7): a contract naming one no layer declares fails to load with MD0302.
#
# One role per file is this layer's convention and `mendel registry lint` enforces it here.
# The format permits several — a private overlay may keep them however it likes, because
# invariant 11 says the layout is the author's business.
roles:
  - id: measurement
    label: Measure a fact
    explain: >-
      Measures the data during the run, such as a genome's length or every read's length, so a
      setting can be decided from it or an earlier estimate confirmed.
