declares: measurement
id: paired
kind: boolean
description: "Whether the library was sequenced paired-end"
cite: "Conesa et al. 2016, doi:10.1186/s13059-016-0881-8"
describes: fastq.reads
meta_key: single_end
meta_values:
  - {when: true, then: false}
  - {when: false, then: true}
explain: >-
  Whether each fragment was read from both ends, giving two files per sample, or from one end
  only. Two files named _R1 and _R2, or _1 and _2, mean paired.
