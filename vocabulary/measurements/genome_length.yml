declares: measurement
id: genome_length
kind: integer
minimum: 1
unit: bp
description: "Total length of the reference genome"
cite: "Ensembl 112 assembly reports"
# A property of the reference, measured in the run by samtools faidx and the .fai parser
# (measurers/measures/genome_length_fai), when nobody states it (comeni-labs#465).
describes: genome.fasta
explain: >-
  How many bases the reference genome holds in all, such as about 3.1 billion for human or
  29,903 for SARS-CoV-2. The assembly's report states it; if you leave it, the pipeline
  measures it from the genome itself.
