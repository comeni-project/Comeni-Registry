name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Comeni-Labs @ mendel-compiler 0.1.0.
  #
  # Pinned by commit SHA with the version in a trailing comment — the convention Comeni-Labs
  # applies to every Action, adopted here for the same reason: a mutable ref can be repointed
  # by whoever controls the other end. There are no engine release tags yet; when one is cut
  # for its own reasons this becomes a tag, which is a one-line change.
  #
  # Bumping this is a deliberate commit in *this* repository, and `docs/tools/` regenerates in
  # the same diff — which is the whole reason those pages are committed rather than published.
  ENGINE_REF: 779c8243e803411514134bc7e39177ecd178cd7e

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install the engine at the pinned commit
        run: |
          uv tool install \
            "mendel-compiler @ git+https://github.com/comeni-project/Comeni-Labs@${ENGINE_REF}#subdirectory=packages/mendel-compiler"
          uv tool install \
            "comeni-vendor @ git+https://github.com/comeni-project/Comeni-Labs@${ENGINE_REF}#subdirectory=packages/comeni-vendor"

      # Loading the layer is the real gate. It runs every MD0001-MD0012 refusal, vocabulary
      # closure (a contract naming an undeclared state fails), rule validation against the
      # parameters contracts actually declare, and role coverage.
      - name: The layer loads
        run: mendel docs --registry . --out "$(mktemp -d)"

      - name: The committed pages match the data
        run: mendel docs --registry . --out docs/tools --check

      # **This could not run here until the modules moved in**, and its absence is the whole
      # argument for that move: MD0104, MD0105 and container drift compare a contract against
      # a main.nf, and that file used to live in another repository on another release cadence.
      # A contract naming a process no module defines would merge here and be caught, if at
      # all, in the Comeni-Labs pull request that bumped the submodule pointer.
      - name: Every contract agrees with its module
        run: mendel conformance --registry .

      # `module/` is a verbatim copy of somebody else's work and is replaced wholesale by
      # `comeni-vendor add`. This is what makes "do not hand-edit this" enforceable rather than
      # a comment somebody reads after they have already edited it.
      #
      # Offline: it compares each directory against the digest its own module.yml records,
      # which is the question about a hand-edit. Whether upstream has *moved* is `--upstream`,
      # needs the network, and is a different question — Comeni-Labs issue #64.
      - name: No module has been hand-edited
        run: comeni-vendor check --registry .
